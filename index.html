<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Orbit Workspace – Automation Demo Sandbox</title>
<meta name="description" content="A safe, fully dummy-data web app for demonstrating AI browser automation: login, 2FA, forms, tables and more." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0;
  --brand:#6366f1; --brand2:#8b5cf6; --brand-soft:#eef2ff;
  --ok:#10b981; --warn:#f59e0b; --bad:#ef4444; --info:#0ea5e9;
  --radius:14px; --shadow:0 1px 2px rgba(15,23,42,.06),0 8px 24px rgba(15,23,42,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand);text-decoration:none}
h1{font-size:26px;letter-spacing:-.02em;font-weight:800}
h2{font-size:18px;font-weight:700;letter-spacing:-.01em}
h3{font-size:15px;font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}
.hidden{display:none!important}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:600;cursor:pointer;transition:.15s;white-space:nowrap}
.btn:hover{border-color:#cbd5e1;transform:translateY(-1px);box-shadow:0 4px 12px rgba(15,23,42,.08)}
.btn:active{transform:translateY(0)}
.btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-color:transparent;box-shadow:0 6px 18px rgba(99,102,241,.35)}
.btn.primary:hover{box-shadow:0 10px 24px rgba(99,102,241,.45)}
.btn.danger{color:var(--bad);border-color:#fecaca;background:#fff5f5}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none}
.btn.block{width:100%}

/* ---------- Form controls ---------- */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label,.lbl{font-weight:600;font-size:13px;color:#334155}
.field .hint{font-size:12px;color:var(--muted)}
.field .err{font-size:12px;color:var(--bad);display:none}
.field.invalid .err{display:block}
.field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--bad);background:#fff7f7}
input[type=text],input[type=email],input[type=password],input[type=tel],input[type=url],input[type=date],input[type=number],input[type=search],select,textarea{
  width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:10px;background:#fff;outline:none;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(99,102,241,.15)}
textarea{min-height:110px;resize:vertical}
.pw{position:relative}
.pw button{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--muted);cursor:pointer;padding:6px;font-size:13px;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 18px}
.check{display:flex;align-items:flex-start;gap:10px;cursor:pointer;font-size:14px}
.check input{width:18px;height:18px;margin-top:2px;accent-color:var(--brand)}
.choice-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.choice{position:relative}
.choice input{position:absolute;opacity:0;inset:0;cursor:pointer}
.choice span{display:block;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;text-align:center;font-weight:600;font-size:14px;background:#fff;transition:.15s}
.choice input:checked+span{border-color:var(--brand);background:var(--brand-soft);color:var(--brand);box-shadow:0 0 0 3px rgba(99,102,241,.12)}
.choice input:focus-visible+span{box-shadow:0 0 0 4px rgba(99,102,241,.25)}
.switch{position:relative;width:46px;height:26px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch i{position:absolute;inset:0;background:#cbd5e1;border-radius:99px;transition:.2s;cursor:pointer}
.switch i:before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch input:checked+i{background:var(--brand)}
.switch input:checked+i:before{transform:translateX(20px)}
input[type=range]{width:100%;accent-color:var(--brand)}
input[type=file]{padding:10px;border:1.5px dashed #cbd5e1;border-radius:10px;width:100%;background:#fafbff}

/* ---------- Cards / layout ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600}
.badge.ok{background:#d1fae5;color:#047857}.badge.warn{background:#fef3c7;color:#b45309}.badge.bad{background:#fee2e2;color:#b91c1c}.badge.info{background:#e0f2fe;color:#0369a1}.badge.gray{background:#f1f5f9;color:#475569}
.badge:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}

/* ---------- Auth screens ---------- */
.auth{min-height:100vh;display:grid;grid-template-columns:1.05fr 1fr}
.auth-hero{position:relative;overflow:hidden;color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between;background:radial-gradient(1200px 600px at 10% -10%,#a78bfa 0%,transparent 60%),radial-gradient(900px 600px at 100% 110%,#38bdf8 0%,transparent 55%),linear-gradient(135deg,#4338ca,#6d28d9)}
.auth-hero:after{content:"";position:absolute;width:520px;height:520px;border-radius:50%;border:1px solid rgba(255,255,255,.18);right:-160px;top:20%;box-shadow:0 0 0 70px rgba(255,255,255,.04),0 0 0 140px rgba(255,255,255,.03)}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.02em}
.logo .mark{width:34px;height:34px;border-radius:10px;background:#fff;display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.2)}
.logo .mark svg{width:20px;height:20px}
.auth-hero h1{font-size:40px;line-height:1.1;max-width:460px;position:relative;z-index:1}
.auth-hero p{opacity:.85;max-width:420px;margin-top:14px;position:relative;z-index:1}
.hero-points{display:grid;gap:12px;position:relative;z-index:1}
.hero-points div{display:flex;gap:12px;align-items:center;font-weight:500}
.hero-points b{width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:14px}
.auth-main{display:grid;place-items:center;padding:40px;background:#fff}
.auth-box{width:100%;max-width:410px}
.auth-box h2{font-size:28px;font-weight:800;letter-spacing:-.02em;margin-bottom:6px}
.divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px;margin:18px 0}
.divider:before,.divider:after{content:"";height:1px;background:var(--line);flex:1}
.demo-hint{margin-top:22px;padding:14px 16px;border-radius:12px;background:var(--brand-soft);border:1px dashed #c7d2fe;font-size:13px;color:#3730a3}
.demo-hint code{background:#fff;padding:1px 7px;border-radius:6px;border:1px solid #e0e7ff;font-weight:600}
.otp{display:flex;gap:10px;justify-content:space-between;margin:18px 0 8px}
.otp input{width:100%;height:56px;text-align:center;font-size:22px;font-weight:700;padding:0}
.alert{padding:11px 14px;border-radius:10px;font-size:13px;margin-bottom:16px;display:none}
.alert.show{display:block}
.alert.bad{background:#fee2e2;color:#991b1b;border:1px solid #fecaca}
.alert.ok{background:#d1fae5;color:#065f46;border:1px solid #a7f3d0}

/* ---------- App shell ---------- */
.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.side{background:#0f172a;color:#cbd5e1;padding:22px 16px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.side .logo{color:#fff;padding:0 8px 22px}
.side nav{display:grid;gap:4px}
.side nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;color:#94a3b8;font-weight:500;transition:.15s}
.side nav a svg{width:19px;height:19px;flex:none}
.side nav a:hover{background:#1e293b;color:#fff}
.side nav a.active{background:linear-gradient(135deg,rgba(99,102,241,.35),rgba(139,92,246,.25));color:#fff;box-shadow:inset 0 0 0 1px rgba(165,180,252,.25)}
.side .spacer{flex:1}
.userchip{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;background:#1e293b}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#f472b6,#fb923c);display:grid;place-items:center;color:#fff;font-weight:700;flex:none}
.userchip b{color:#fff;display:block;font-size:14px;line-height:1.2}
.userchip small{color:#94a3b8;font-size:12px}
.main{min-width:0}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 32px;background:rgba(244,246,251,.85);backdrop-filter:blur(8px);position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line)}
.search-top{max-width:360px;width:100%}
.content{padding:28px 32px 60px;max-width:1240px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.page-head p{color:var(--muted);margin-top:4px}

/* ---------- Dashboard ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:22px}
.kpi{position:relative;overflow:hidden}
.kpi .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;margin-bottom:14px}
.kpi .val{font-size:30px;font-weight:800;letter-spacing:-.02em}
.kpi .delta{font-size:12px;font-weight:600;margin-top:4px}
.delta.up{color:var(--ok)}.delta.down{color:var(--bad)}
.two{display:grid;grid-template-columns:1.6fr 1fr;gap:18px}
.chart{display:flex;align-items:flex-end;gap:14px;height:240px;padding-top:10px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}
.chart .bar{width:100%;max-width:44px;border-radius:8px 8px 4px 4px;background:linear-gradient(180deg,var(--brand2),var(--brand));transform-origin:bottom;animation:grow .8s cubic-bezier(.2,.8,.2,1) both;position:relative}
.chart .bar:hover:after{content:attr(data-v);position:absolute;top:-28px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;font-size:12px;padding:3px 8px;border-radius:6px}
.chart .col span{font-size:12px;color:var(--muted)}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.activity{display:grid;gap:16px}
.activity li{list-style:none;display:flex;gap:12px;align-items:flex-start}
.dot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none}

/* ---------- Table ---------- */
.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.toolbar .grow{flex:1;min-width:200px}
.toolbar select{width:auto}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;background:#fff}
th,td{padding:14px 16px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:#f8fafc;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);cursor:pointer;user-select:none}
th:hover{color:var(--ink)}
tbody tr{transition:.12s}
tbody tr:hover{background:#f8faff}
tbody tr:last-child td{border-bottom:0}
.who{display:flex;align-items:center;gap:12px}
.who .avatar{width:34px;height:34px;font-size:13px}
.pager{display:flex;justify-content:space-between;align-items:center;margin-top:14px;flex-wrap:wrap;gap:10px}
.empty{text-align:center;padding:40px;color:var(--muted)}

/* ---------- Stepper ---------- */
.stepper{display:flex;align-items:center;margin-bottom:28px}
.step{display:flex;align-items:center;gap:10px;font-weight:600;color:var(--muted);font-size:14px}
.step .n{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);background:#fff;font-size:13px;transition:.2s}
.step.active{color:var(--ink)}
.step.active .n{border-color:var(--brand);background:var(--brand);color:#fff;box-shadow:0 0 0 5px rgba(99,102,241,.18)}
.step.done .n{border-color:var(--ok);background:var(--ok);color:#fff}
.step.done{color:var(--ink)}
.bar-line{flex:1;height:2px;background:var(--line);margin:0 14px;min-width:20px}
.bar-line.done{background:var(--ok)}
.wizard-foot{display:flex;justify-content:space-between;margin-top:10px;padding-top:20px;border-top:1px solid var(--line)}
.review dl{display:grid;grid-template-columns:200px 1fr;gap:10px 18px}
.review dt{color:var(--muted);font-weight:500}
.review dd{font-weight:600}
.success{text-align:center;padding:30px 10px}
.success .tick{width:84px;height:84px;border-radius:50%;background:#d1fae5;color:var(--ok);display:grid;place-items:center;margin:0 auto 18px;font-size:42px;animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.refid{display:inline-block;margin-top:14px;padding:8px 16px;border-radius:10px;background:var(--brand-soft);color:var(--brand);font-weight:700;letter-spacing:.04em}

/* ---------- Settings ---------- */
.row{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:16px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.tabs{display:flex;gap:6px;margin-bottom:20px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:10px 16px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;margin-bottom:-1px}
.tabs button.active{color:var(--brand);border-color:var(--brand)}

/* ---------- Modal / toast ---------- */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:50;padding:20px;animation:fade .15s}
.modal{background:#fff;border-radius:18px;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:28px;box-shadow:0 30px 80px rgba(0,0,0,.35);animation:rise .22s cubic-bezier(.2,.9,.3,1)}
.modal.sm{max-width:420px}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:8px}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(18px) scale(.97);opacity:0}}
#toasts{position:fixed;right:22px;bottom:22px;display:grid;gap:10px;z-index:100}
.toast{background:#0f172a;color:#fff;padding:13px 18px;border-radius:12px;box-shadow:0 14px 34px rgba(0,0,0,.3);display:flex;gap:10px;align-items:center;font-weight:500;min-width:260px;animation:slide .3s cubic-bezier(.2,.9,.3,1)}
.toast.ok{border-left:4px solid var(--ok)}.toast.bad{border-left:4px solid var(--bad)}.toast.info{border-left:4px solid var(--info)}
@keyframes slide{from{transform:translateX(40px);opacity:0}}
.view{animation:fade .25s}

/* ---------- SaaS additions ---------- */
.hero-bottom{position:relative;z-index:1;display:grid;gap:26px}
.quote{padding:20px 22px;border-radius:16px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(6px);font-size:15px;max-width:460px}
.quote footer{display:flex;gap:12px;align-items:center;margin-top:14px;font-size:13px;line-height:1.3}
.quote small{opacity:.8}
.trust-row{display:flex;flex-wrap:wrap;gap:10px}
.trust-row span{padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);font-size:12px;font-weight:600}
.nav-group{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#64748b;font-weight:700;padding:14px 12px 6px}
.ws{display:flex;align-items:center;gap:10px;width:100%;padding:10px;margin-bottom:6px;border-radius:12px;border:1px solid #1e293b;background:#111c33;color:#fff;cursor:pointer;transition:.15s}
.ws:hover{border-color:#334155}
.ws b{display:block;font-size:14px;line-height:1.2}.ws small{color:#94a3b8;font-size:12px}
.ws-ic{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#f59e0b,#ef4444);display:grid;place-items:center;color:#fff;font-weight:800;flex:none}
.plan-card{padding:14px;border-radius:12px;background:#111c33;border:1px solid #1e293b;margin-bottom:12px;display:grid;gap:8px}
.meter{height:7px;border-radius:99px;background:#1e293b;overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#818cf8,#c084fc)}
.meter.light{background:#e2e8f0}.meter.light i{background:linear-gradient(90deg,var(--brand),var(--brand2))}
.crumbs{display:flex;gap:8px;align-items:center;font-size:14px;white-space:nowrap}
.topbar .search-top{flex:1;max-width:340px}
.status-pill{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:#047857;background:#d1fae5;padding:6px 12px;border-radius:99px;white-space:nowrap}
.status-pill i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(16,185,129,.6);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 7px rgba(16,185,129,0)}100%{box-shadow:0 0 0 0 rgba(16,185,129,0)}}
.icon-btn{position:relative;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:16px}
.icon-btn:hover{border-color:#cbd5e1}
.icon-btn em{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:99px;background:var(--bad);color:#fff;font-size:11px;font-style:normal;font-weight:700;display:grid;place-items:center;padding:0 4px}
.avatar-btn{border:0;background:none;cursor:pointer;border-radius:50%}
.pop{position:absolute;right:0;top:48px;width:320px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 50px rgba(15,23,42,.18);z-index:30;overflow:hidden;animation:rise .15s}
.pop-h{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.pop-i{padding:12px 16px;border-bottom:1px solid var(--line);display:grid;font-size:14px}
.pop-i small{color:var(--muted)}.pop-i.unread{background:var(--brand-soft)}
.pop-a{display:block;padding:11px 16px;color:var(--ink);font-weight:500;font-size:14px}
.pop-a:hover{background:#f8fafc}
.checklist{margin-bottom:22px;background:linear-gradient(135deg,#fff,#f5f3ff)}
.check-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:16px}
.chk{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:500;font-size:14px;transition:.15s}
.chk:hover{border-color:var(--brand);transform:translateY(-1px)}
.chk span{width:20px;height:20px;border-radius:50%;border:2px solid #cbd5e1;display:grid;place-items:center;font-size:12px;color:#fff;flex:none}
.chk.done span{background:var(--ok);border-color:var(--ok)}
.chk.done{color:var(--muted);text-decoration:line-through}
.int-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.int{display:flex;flex-direction:column;gap:14px}
.int .lg{width:46px;height:46px;border-radius:12px;color:#fff;display:grid;place-items:center;font-weight:800;font-size:20px}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.plan{display:flex;flex-direction:column;gap:14px;position:relative}
.plan.current{border:2px solid var(--brand);box-shadow:0 10px 30px rgba(99,102,241,.2)}
.plan .price{font-size:36px;font-weight:800;letter-spacing:-.02em}
.plan ul{list-style:none;display:grid;gap:8px;font-size:14px;flex:1}
.plan li:before{content:"✓";color:var(--ok);font-weight:800;margin-right:8px}
.ribbon{position:absolute;top:-12px;left:20px}
.seg{display:inline-flex;background:#f1f5f9;border-radius:10px;padding:4px}
.seg button{border:0;background:none;padding:7px 16px;border-radius:7px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.active{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.usage{display:grid;gap:16px}
.usage .meter{background:#e2e8f0}.usage .meter i{background:linear-gradient(90deg,var(--brand),var(--brand2))}
.footer-note{margin-top:40px;padding-top:18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;color:var(--muted);font-size:13px}
@media (max-width:1000px){

/* ---------- validation ---------- */
const rules = {
  required:(v)=> v.trim()!=='' || 'This field is required',
  email:(v)=> /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v) || 'Enter a valid email address',
  phone:(v)=> v==='' || /^[+\d][\d\s\-()]{7,}$/.test(v) || 'Enter a valid phone number',
  url:(v)=> v==='' || /^https?:\/\/.+\..+/.test(v) || 'Enter a valid URL starting with http(s)://',
  min8:(v)=> v.length>=8 || 'Must be at least 8 characters'
};
function validate(form){
  let ok=true, first=null;
  $$('[data-rules]',form).forEach(el=>{
    const field=el.closest('.field'); let msg=true;
    for(const r of el.dataset.rules.split(' ')){ const res=rules[r](el.value); if(res!==true){msg=res;break;} }
    if(msg!==true){ ok=false; field.classList.add('invalid'); $('.err',field).textContent=msg; first=first||el; }
    else field.classList.remove('invalid');
  });
  if(first) first.focus();
  return ok;
}

const publicRoutes = ['#/login','#/signup','#/verify'];
function route(){
  closeModal();
  let h = location.hash || '#/login';
  if(h==='#/verify' && !S.pending2fa) h='#/login';
  if(!publicRoutes.includes(h) && !S.session) h='#/login';
  if(S.session && publicRoutes.includes(h)) h='#/dashboard';
  if(location.hash!==h){ location.hash=h; return; }
  const views = {
    '#/login':viewLogin,'#/signup':viewSignup,'#/verify':viewVerify,
    '#/dashboard':()=>shell('dashboard',viewDashboard),
    '#/customers':()=>shell('customers',viewCustomers),
    '#/onboarding':()=>shell('onboarding',viewOnboarding),
    '#/team':()=>shell('team',viewTeam),
    '#/integrations':()=>shell('integrations',viewIntegrations),
    '#/billing':()=>shell('billing',viewBilling),
    '#/support':()=>shell('support',viewSupport),
    '#/settings':()=>shell('settings',viewSettings)
  };
  (views[h]||views['#/dashboard'])();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);

function viewVerify(){
  authShell(`
    <h2>Two-step verification</h2>
    <p class="muted">Enter the 6-digit code from your authenticator app to continue.</p>
    <div id="otp-alert" class="alert bad" role="alert" style="margin-top:18px" data-testid="otp-error"></div>
    <form id="otp-form" novalidate>
      <div class="otp">${[0,1,2,3,4,5].map(i=>`<input type="text" inputmode="numeric" maxlength="1" aria-label="Digit ${i+1}" data-i="${i}" data-testid="otp-${i+1}" autocomplete="off" />`).join('')}</div>
      <p class="small muted" style="margin-bottom:18px">Code expires in <b id="otp-timer">02:00</b></p>
      <button class="btn primary block" type="submit" id="otp-btn" data-testid="otp-submit">Verify &amp; continue</button>
    </form>
    <p class="small muted" style="text-align:center;margin-top:20px"><a href="#" id="otp-back">← Back to sign in</a></p>
    ${HINTS?`<div class="demo-hint">Demo code: <code>${DEMO.otp}</code></div>`:''}
  `);
  const boxes=$$('.otp input');
  boxes[0].focus();
  boxes.forEach((b,i)=>{
    b.addEventListener('input',()=>{ b.value=b.value.replace(/\D/g,''); if(b.value && boxes[i+1]) boxes[i+1].focus(); });
    b.addEventListener('keydown',e=>{ if(e.key==='Backspace' && !b.value && boxes[i-1]) boxes[i-1].focus(); });
    b.addEventListener('paste',e=>{ const t=(e.clipboardData.getData('text')||'').replace(/\D/g,'').slice(0,6); if(!t) return; e.preventDefault(); t.split('').forEach((c,k)=>boxes[k].value=c); boxes[Math.min(t.length,5)].focus(); });
  });
  let left=120; const tm=setInterval(()=>{ const el=$('#otp-timer'); if(!el){clearInterval(tm);return;} left=Math.max(0,left-1); el.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0'); },1000);
  $('#otp-back').onclick=e=>{ e.preventDefault(); S.pending2fa=false; save(); go('#/login'); };
  $('#otp-form').onsubmit=async e=>{
    e.preventDefault();
    const code=boxes.map(b=>b.value).join(''); const al=$('#otp-alert'); al.classList.remove('show');
    if(code.length<6){ al.textContent='Please enter all 6 digits.'; al.classList.add('show'); return; }
    const btn=$('#otp-btn'); btn.disabled=true; btn.textContent='Verifying…'; await sleep(800);
    if(code!==DEMO.otp){ btn.disabled=false; btn.textContent='Verify & continue'; al.textContent='That code is not valid. Please try again.'; al.classList.add('show'); boxes.forEach(b=>b.value=''); boxes[0].focus(); return; }
    S.pending2fa=false; S.session=true; save(); toast('Verified. Welcome, '+S.settings.name.split(' ')[0]+'!'); go('#/dashboard');
  };
}

    });
    rows.sort((a,b)=>{ const x=a[custState.sort],y=b[custState.sort]; return (x>y?1:x<y?-1:0)*custState.dir; });
    const pages=Math.max(1,Math.ceil(rows.length/custState.per)); custState.page=Math.min(custState.page,pages);
    const slice=rows.slice((custState.page-1)*custState.per,custState.page*custState.per);

    $('#c-table').innerHTML=`

    $$('th[data-sort]').forEach(h=>h.onclick=()=>{ const k=h.dataset.sort; custState.dir=custState.sort===k?-custState.dir:1; custState.sort=k; draw(); });
    $('#pg-prev').onclick=()=>{custState.page--;draw();}; $('#pg-next').onclick=()=>{custState.page++;draw();};

  draw();
}

    <h2 style="margin-bottom:18px">Customise your workspace</h2>
    <div class="field"><span class="lbl">Integrations to connect</span><div class="choice-grid">${['Slack','Gmail','Salesforce','HubSpot','Stripe','Notion'].map(i=>`<label class="choice"><input type="checkbox" name="integ" value="${i}" ${d.integrations.includes(i)?'checked':''}/><span>${i}</span></label>`).join('')}</div></div>
    <div class="field"><label for="w-budget">Monthly budget: <b id="w-budget-out">$${d.budget*20}</b></label><input id="w-budget" type="range" min="0" max="100" value="${d.budget}" data-testid="w-budget" /><span class="hint">Slide to set an estimated monthly spend.</span></div>
    <div class="field"><label for="w-notes">Anything we should know?</label><textarea id="w-notes" placeholder="e.g. We want to migrate 2,000 contacts from a spreadsheet…" data-testid="w-notes">${esc(d.notes)}</textarea></div>
    <div class="field"><label for="w-file">Attach a brief (optional)</label><input id="w-file" type="file" data-testid="w-file" /><span class="hint" id="w-file-name">${d.fileName?'Selected: '+esc(d.fileName):'PDF, DOCX or image. Files stay in your browser.'}</span></div>
    <label class="check"><input type="checkbox" id="w-terms" ${d.terms?'checked':''} data-testid="w-terms"/> <span>I agree to the data processing terms</span></label>`;
  if(wiz.step===4) body=`
    <h2 style="margin-bottom:6px">Review &amp; submit</h2><p class="muted" style="margin-bottom:20px">Check everything looks right before you submit.</p>
    <div class="review card" style="background:#fafbff;box-shadow:none"><dl>
      <dt>Company</dt><dd>${esc(d.company)}</dd><dt>Website</dt><dd>${esc(d.site||'—')}</dd><dt>Industry</dt><dd>${esc(d.industry)}</dd><dt>Company size</dt><dd>${esc(d.size)} people</dd>
      <dt>Contact</dt><dd>${esc(d.name)}${d.role?' · '+esc(d.role):''}</dd><dt>Email</dt><dd>${esc(d.email)}</dd><dt>Phone</dt><dd>${esc(d.phone||'—')}</dd><dt>Country</dt><dd>${esc(d.country)}</dd>
      <dt>Start date</dt><dd>${esc(d.start)}</dd><dt>Integrations</dt><dd>${d.integrations.length?esc(d.integrations.join(', ')):'None'}</dd><dt>Budget</dt><dd>$${d.budget*20} / month</dd><dt>Notes</dt><dd>${esc(d.notes||'—')}</dd>
    </dl></div>`;
  el.innerHTML=`
    <div class="page-head"><div><h1>New customer onboarding</h1><p>A guided 4-step flow to get a new account live.</p></div></div>
    <div class="card" style="max-width:860px">${stepper}<form id="wiz-form" novalidate autocomplete="off">${body}
      <div class="wizard-foot"><button type="button" class="btn" id="w-back" ${wiz.step===1?'disabled':''}>← Back</button>
      <button type="submit" class="btn primary" id="w-next" data-testid="w-next">${wiz.step===4?'Submit onboarding ✓':'Continue →'}</button></div></form></div>`;
  const form=$('#wiz-form');
  if(wiz.step===3){
    $('#w-budget').oninput=e=>$('#w-budget-out').textContent='$'+(e.target.value*20);
    $('#w-file').onchange=e=>{ const f=e.target.files[0]; $('#w-file-name').textContent=f?'Selected: '+f.name:''; };
  }
  $('#w-back').onclick=()=>{ collect(); wiz.step--; route(); };
  form.onsubmit=async e=>{
    e.preventDefault();
    if(wiz.step<4){
      if(!validate(form)) return;
      if(wiz.step===3 && !$('#w-terms').checked){ toast('Please accept the data processing terms','bad'); return; }
      collect(); wiz.step++; route(); return;
    }
    const btn=$('#w-next'); btn.disabled=true; btn.textContent='Submitting…'; await sleep(1400);
    const ref=rid('ONB'); wiz.done={ref,company:wiz.data.company};
    S.onboardings.push({ref,...wiz.data}); 
    const max=Math.max(...S.customers.map(c=>+c.id.split('-')[1]),1000);
    S.customers.unshift({id:'CUS-'+(max+1),name:wiz.data.name,company:wiz.data.company,email:wiz.data.email,status:'Trial',plan:'Pro',country:wiz.data.country,joined:today(),mrr:0});
    save(); toast('Onboarding submitted'); route();
  };
  function collect(){
    const g=id=>{const x=$('#'+id);return x?x.value:undefined};
    const d=wiz.data;
    if(wiz.step===1){ d.company=g('w-company').trim(); d.site=g('w-site').trim(); d.industry=g('w-industry'); const r=$('input[name=size]:checked'); if(r) d.size=r.value; }
    if(wiz.step===2){ d.name=g('w-name').trim(); d.role=g('w-role').trim(); d.email=g('w-email').trim(); d.phone=g('w-phone').trim(); d.country=g('w-country'); d.start=g('w-start'); }
    if(wiz.step===3){ d.integrations=$$('input[name=integ]:checked').map(x=>x.value); d.budget=+g('w-budget'); d.notes=g('w-notes').trim(); d.terms=$('#w-terms').checked; const f=$('#w-file').files[0]; if(f) d.fileName=f.name; }
  }
}

          <div class="grid3">
            <div class="field"><label for="s-role">Role</label><select id="s-role">${['Owner','Admin','Manager','Analyst','Viewer'].map(r=>`<option ${s.role===r?'selected':''}>${r}</option>`).join('')}</select></div>
            <div class="field"><label for="s-tz">Time zone</label><select id="s-tz">${['Asia/Kolkata','America/New_York','Europe/London','Europe/Berlin','Asia/Tokyo','Australia/Sydney'].map(r=>`<option ${s.timezone===r?'selected':''}>${r}</option>`).join('')}</select></div>
            <div class="field"><label for="s-theme">Theme</label><select id="s-theme">${['Light','Dark','System'].map(r=>`<option ${s.theme===r?'selected':''}>${r}</option>`).join('')}</select></div>
          </div>
        </div>

          ${tog('s-notifPush','Push notifications','Instant alerts on your device',s.notifPush)}

          ${tog('s-twofa','Two-step verification','Require a one-time code at every sign-in',s.twofa)}
          <div class="row"><div><b>Active sessions</b><div class="muted small">Chrome on macOS · Last active just now</div></div><button type="button" class="btn sm" id="s-revoke">Sign out other devices</button></div>
        </div>
        <div class="wizard-foot" style="margin-top:20px"><button type="button" class="btn" id="s-cancel">Discard</button><button type="submit" class="btn primary" data-testid="s-save">Save changes</button></div>
      </form>
    </div>`;
  $$('[data-tab]').forEach(b=>b.onclick=()=>{ settingsTab=b.dataset.tab; viewSettings(el); });

  $('#s-revoke').onclick=()=>toast('Signed out of 2 other devices');

    const v=id=>$('#'+id);

    save(); toast('Settings saved'); shell('settings',viewSettings);
  };
}

function viewTeam(el){

        <td>${m.role==='Owner'?roleBadge('Owner'):`<select data-role="${m.id}" aria-label="Role for ${esc(m.name)}" style="width:auto;padding:6px 10px">${['Admin','Manager','Analyst','Viewer'].map(r=>`<option ${m.role===r?'selected':''}>${r}</option>`).join('')}</select>`}</td>
        <td>${m.status==='Active'?'<span class="badge ok">Active</span>':'<span class="badge warn">Invited</span>'}</td><td class="muted">${esc(m.last)}</td>
        <td style="text-align:right">${m.role==='Owner'?'':`${m.status==='Invited'?`<button class="btn sm" data-resend="${m.id}">Resend</button> `:''}<button class="btn sm danger" data-remove="${m.id}">Remove</button>`}</td></tr>`).join('')}
    </tbody></table></div></div>`;
  $('#invite').onclick=()=>{
    if(S.team.length>=cap){ toast('Seat limit reached. Upgrade your plan to invite more.','bad'); return; }
    openModal(`<div class="card-head"><h2>Invite a teammate</h2><button class="btn ghost sm" id="m-x">✕</button></div>
      <form id="inv-form" novalidate autocomplete="off">
        <div class="field"><label for="i-name">Full name</label><input id="i-name" type="text" data-rules="required" data-testid="invite-name" /><span class="err"></span></div>
        <div class="field"><label for="i-email">Work email</label><input id="i-email" type="email" data-rules="required email" data-testid="invite-email" /><span class="err"></span></div>
        <div class="field"><label for="i-role">Role</label><select id="i-role" data-testid="invite-role"><option>Admin</option><option selected>Manager</option><option>Analyst</option><option>Viewer</option></select></div>
        <div class="field"><label for="i-msg">Personal message (optional)</label><textarea id="i-msg" style="min-height:80px" placeholder="Hey, join our workspace on Orbit!"></textarea></div>
        <div class="modal-foot"><button type="button" class="btn" id="m-cancel">Cancel</button><button type="submit" class="btn primary" data-testid="send-invite">Send invite</button></div>
      </form>`);
    $('#m-x').onclick=$('#m-cancel').onclick=closeModal; $('#i-name').focus();
    $('#inv-form').onsubmit=e=>{
      e.preventDefault(); if(!validate(e.target)) return;
      S.team.push({id:'USR-'+(S.team.length+10),name:$('#i-name').value.trim(),email:$('#i-email').value.trim(),role:$('#i-role').value,status:'Invited',last:'—'});
      S.notifs.unshift({id:Date.now(),t:'Invite sent to '+$('#i-email').value.trim(),s:'Just now',unread:true});
      save(); closeModal(); toast('Invitation sent'); route();
    };
  };
  $$('[data-role]').forEach(s=>s.onchange=()=>{ S.team.find(m=>m.id===s.dataset.role).role=s.value; save(); toast('Role updated to '+s.value); });
  $$('[data-resend]').forEach(b=>b.onclick=()=>toast('Invitation resent'));
  $$('[data-remove]').forEach(b=>b.onclick=()=>{
    const m=S.team.find(x=>x.id===b.dataset.remove);
    openModal(`<h2>Remove ${esc(m.name)}?</h2><p class="muted" style="margin:10px 0 22px">They will immediately lose access to this workspace.</p>
      <div class="modal-foot"><button class="btn" id="m-cancel">Cancel</button><button class="btn danger" id="m-confirm" data-testid="confirm-remove">Remove member</button></div>`,'sm');
    $('#m-cancel').onclick=closeModal;
    $('#m-confirm').onclick=()=>{ S.team=S.team.filter(x=>x.id!==m.id); save(); closeModal(); toast(m.name+' was removed'); route(); };
  });
}

    </div>
    <div class="card"><div class="card-head"><h2>Invoice history</h2></div><div class="table-wrap"><table data-testid="invoices-table"><thead><tr><th>Invoice</th><th>Date</th><th>Amount</th><th>Status</th><th></th></tr></thead><tbody>
      ${seedInvoices.map(i=>`<tr><td><b>${i.id}</b></td><td>${i.date}</td><td>$${i.amount}.00</td><td><span class="badge ok">${i.status}</span></td><td style="text-align:right"><button class="btn sm" data-dl="${i.id}">⬇ PDF</button></td></tr>`).join('')}</tbody></table></div></div>`;
  $$('[data-per]').forEach(b=>b.onclick=()=>{ S.yearly=b.dataset.per==='y'; save(); viewBilling(el); });
  $$('[data-dl]').forEach(b=>b.onclick=()=>toast('Downloading '+b.dataset.dl+'.pdf','info'));
  $$('[data-plan]').forEach(b=>b.onclick=()=>{
    const target=b.dataset.plan, p=plans.find(x=>x.n===target);
    openModal(`<h2>Switch to ${target}?</h2><p class="muted" style="margin:10px 0 18px">You will be billed <b style="color:var(--ink)">$${S.yearly?p.y:p.m}/month</b> (${S.yearly?'yearly':'monthly'}). Changes take effect immediately and are prorated.</p>
      <label class="check" style="margin-bottom:20px"><input type="checkbox" id="pl-ok" data-testid="plan-confirm-check" /> I understand the new pricing</label>
      <div class="modal-foot"><button class="btn" id="m-cancel">Cancel</button><button class="btn primary" id="m-confirm" data-testid="plan-confirm">Confirm change</button></div>`,'sm');
    $('#m-cancel').onclick=closeModal;
    $('#m-confirm').onclick=async()=>{
      if(!$('#pl-ok').checked){ toast('Please confirm the pricing to continue','bad'); return; }
      const btn=$('#m-confirm'); btn.disabled=true; btn.textContent='Processing…'; await sleep(1100);
      S.plan=target; S.notifs.unshift({id:Date.now(),t:'Plan changed to '+target,s:'Just now',unread:true}); save(); closeModal(); toast('You are now on the '+target+' plan'); route();
    };
  });
  $('#edit-card').onclick=()=>{
    openModal(`<div class="card-head"><h2>Update payment method</h2><button class="btn ghost sm" id="m-x">✕</button></div>
      <form id="card-form" novalidate autocomplete="off">
        <div class="field"><label for="c-name">Name on card</label><input id="c-name" type="text" value="Alex Morgan" data-rules="required" data-testid="card-name" /><span class="err"></span></div>
        <div class="field"><label for="c-num">Card number</label><input id="c-num" type="text" inputmode="numeric" placeholder="4242 4242 4242 4242" data-rules="required" data-testid="card-number" /><span class="hint">Test mode only. No real payment is processed.</span><span class="err"></span></div>
        <div class="grid2"><div class="field"><label for="c-exp">Expiry</label><input id="c-exp" type="text" placeholder="MM / YY" data-rules="required" data-testid="card-expiry" /><span class="err"></span></div>
        <div class="field"><label for="c-cvc">CVC</label><input id="c-cvc" type="text" inputmode="numeric" placeholder="123" data-rules="required" data-testid="card-cvc" /><span class="err"></span></div></div>
        <div class="modal-foot"><button type="button" class="btn" id="m-cancel">Cancel</button><button type="submit" class="btn primary" data-testid="card-save">Save card</button></div>
      </form>`);
    $('#m-x').onclick=$('#m-cancel').onclick=closeModal; $('#c-num').focus();
    $('#c-num').oninput=e=>{ e.target.value=e.target.value.replace(/\D/g,'').slice(0,16).replace(/(.{4})/g,'$1 ').trim(); };
    $('#card-form').onsubmit=e=>{ e.preventDefault(); if(!validate(e.target)) return; closeModal(); toast('Payment method updated'); };
  };
}

/* ---------- boot ---------- */
route();
</script>
</body>
</html>
